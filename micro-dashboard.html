<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>微观电商数据看板</title>
  <script src="vendor/echarts.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <style>
    body { margin: 0; background: #0a1628; color: #fff; font-family: sans-serif; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    .card { background: #0d1f3c; border-radius: 8px; height: 320px; }
    .full { grid-column: 1 / -1; }

    /* 顶部工具条 */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
    .topbar h1 { margin: 0; font-size: 18px; color: #fff; }
    #view-report-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1e90ff; color: #fff; border: none; border-radius: 6px;
      padding: 9px 16px; font-size: 14px; cursor: pointer;
    }
    #view-report-btn:hover { background: #00a0ff; }

    /* 报告模态框 */
    .report-modal {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .report-modal[hidden] { display: none; }
    .report-modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); }
    .report-modal-card {
      position: relative; z-index: 1; width: min(960px, 92vw); height: 88vh;
      background: #fff; color: #1f2733; border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .report-modal-close {
      position: absolute; top: 12px; right: 14px; z-index: 2;
      width: 32px; height: 32px; border: none; border-radius: 50%;
      background: #eef2f7; color: #333; font-size: 16px; cursor: pointer; line-height: 1;
    }
    .report-modal-close:hover { background: #dde4ec; }
    .report-content { flex: 1; overflow-y: auto; padding: 28px 36px 40px; }

    /* 报告正文排版 */
    .report-content { font-size: 15px; line-height: 1.7; color: #1f2733; }
    .report-content h1, .report-content h2, .report-content h3,
    .report-content h4, .report-content h5, .report-content h6 {
      font-weight: 700; color: #111827; line-height: 1.3;
    }
    .report-content h1 { font-size: 24px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #e3e8ef; }
    .report-content h2 { font-size: 20px; margin: 26px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #e3e8ef; }
    .report-content h3 { font-size: 17px; margin: 20px 0 10px; }
    .report-content p { margin: 10px 0; }
    .report-content a { color: #1e90ff; }
    .report-content strong { font-weight: 700; color: #111827; }
    .report-content ul, .report-content ol { margin: 10px 0; padding-left: 24px; }
    .report-content li { margin: 4px 0; }
    .report-content table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
    .report-content th, .report-content td { border: 1px solid #d7dee8; padding: 8px 10px; text-align: left; vertical-align: top; }
    .report-content th { background: #f2f5f9; font-weight: 700; }
    .report-content tr:nth-child(even) td { background: #fafbfd; }
    .report-content code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      background: #f0f2f5; padding: 2px 5px; border-radius: 4px; font-size: 0.9em; color: #c0392b;
    }
    .report-content pre {
      background: #f4f5f7; padding: 14px 16px; border-radius: 8px; overflow-x: auto; margin: 14px 0;
    }
    .report-content pre code { background: none; padding: 0; color: #24292e; }
    .report-content blockquote {
      margin: 14px 0; padding: 10px 16px; border-left: 4px solid #1e90ff;
      background: #f0f6ff; color: #44506b; border-radius: 0 6px 6px 0;
    }
    .report-content hr { border: none; border-top: 1px solid #e3e8ef; margin: 24px 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>微观电商数据看板</h1>
    <button id="view-report-btn">📄 查看分析报告</button>
  </div>
  <div class="grid">
    <div id="micro-kpi-cards" class="full" style="height:auto;background:transparent;"></div>
    <div id="micro-price-trend" class="card full" style="height:360px;"></div>
    <div id="micro-category" class="card"></div>
    <div id="micro-volatility" class="card"></div>
    <div id="micro-anomaly-table" class="card full"></div>
  </div>

  <div id="report-modal" class="report-modal" hidden>
    <div class="report-modal-backdrop"></div>
    <div class="report-modal-card">
      <button id="report-modal-close" class="report-modal-close" title="关闭">✕</button>
      <div id="report-modal-content" class="report-content"></div>
    </div>
  </div>

  <script src="components/micro-charts.js?v=5"></script>
  <script>
    // 因为 fetch 需要 http 服务，本地建议用 python -m http.server 打开
    initMicroCharts();
    initReportModal();
  </script>
</body>
</html>
